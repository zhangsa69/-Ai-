<script id="xchat-extra-script">
(function() {
  "use strict";

  // 拦截所有「对话/开始使用」按钮点击，切换到对话面板
  function interceptButtons() {
    document.addEventListener('click', function(e) {
      var btn = e.target.closest('[class*="Button_button"]');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      openChat();
    }, true);

    // 输入框回车也打开对话
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
      var input = document.querySelector('textarea, [contenteditable], input[type="text"]');
      if (!input || document.activeElement !== input) return;
      e.preventDefault();
      e.stopPropagation();
      openChat();
    }, true);
  }

  function openChat() {
    // 先获取首页输入内容（排除聊天面板自己的输入框）
    var realInput = document.querySelector('[class*="Launcher"] textarea, [class*="Launcher"] [contenteditable], [class*="Capture"] textarea, [class*="Capture"] [contenteditable], .ProseMirror');
    // 如果首页输入框不可用，尝试获取页面中第一个可编辑元素（排除聊天面板）
    if (!realInput || realInput.closest('#xchat-container')) {
      var allInputs = document.querySelectorAll('textarea, [contenteditable], input[type="text"], .ProseMirror');
      for (var i = 0; i < allInputs.length; i++) {
        if (!allInputs[i].closest('#xchat-container')) {
          realInput = allInputs[i];
          break;
        }
      }
    }
    var question = '';
    if (realInput) {
      question = (realInput.value !== undefined ? realInput.value : (realInput.innerText || realInput.textContent || '')).trim();
      if (realInput.value !== undefined) realInput.value = '';
      else realInput.innerText = '';
    }

    var panel = document.getElementById('xchat-container');
    var msgs = document.getElementById('xchat-msgs');
    // 清空旧对话，重置为初始状态
    msgs.innerHTML = '<div class="xchat-msg ai">你好！我是JC小智，有什么可以帮你的？</div>';
    xchatConvId = null;
    xchatSending = false;
    ticketSubmitting = false;
    uploadedFiles = [];
    document.getElementById('preview-imgs').innerHTML = '';
    document.getElementById('xchat-form').style.display = 'none';
    document.getElementById('xchat-input-wrap').style.display = 'flex';
    var btn = document.getElementById('ticket-submit-btn');
    if (btn) { btn.disabled = false; btn.textContent = '提交工单'; }
    document.getElementById('xchat-send').disabled = false;
    panel.classList.add('active');

    if (question) {
      document.getElementById('xchat-input').value = question;
      setTimeout(function() { sendMessage(); }, 200);
    } else {
      document.getElementById('xchat-input').value = '';
      document.getElementById('xchat-input').focus();
    }
  }

  function closeChat() {
    document.getElementById('xchat-container').classList.remove('active');
    document.getElementById('xchat-msgs').innerHTML = '<div class="xchat-msg ai">你好！我是JC小智，有什么可以帮你的？</div>';
    xchatConvId = null;
    ticketSubmitting = false;
    uploadedFiles = [];
    document.getElementById('preview-imgs').innerHTML = '';
    document.getElementById('xchat-form').style.display = 'none';
    document.getElementById('xchat-input-wrap').style.display = 'flex';
    disableInput(false);
    var btn = document.getElementById('ticket-submit-btn');
    if (btn) { btn.disabled = false; btn.textContent = '提交工单'; }
    document.getElementById('xchat-input').value = '';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', interceptButtons);
  } else {
    interceptButtons();
  }
})();
</script>

<script>
var xchatConvId = null;
var xchatSending = false;

function sendMessage() {
  if (xchatSending) return;
  var input = document.getElementById('xchat-input');
  var msg = input.value.trim();
  if (!msg) return;

  xchatSending = true;
  var msgs = document.getElementById('xchat-msgs');
  var sendBtn = document.getElementById('xchat-send');
  sendBtn.disabled = true;

  // 用户消息
  msgs.appendChild(createMsg('user', msg));
  input.value = '';
  input.style.height = 'auto';

  // 加载动画
  var typing = createTyping();
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;

  // SSE 请求
  fetch('/api/chat/ask', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: msg, conversation_id: xchatConvId})
  }).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var aiDiv = null;

    function read() {
      reader.read().then(function(r) {
        if (r.done) { finish(); return; }
        var text = decoder.decode(r.value, {stream: true});
        var lines = text.split('\n');
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line.startsWith('data:')) continue;
          try {
            var data = JSON.parse(line.slice(5));
            if (data.type === 'chunk') {
              if (!aiDiv) { typing.remove(); aiDiv = createMsg('ai', ''); msgs.appendChild(aiDiv); }
              aiDiv._rawText = (aiDiv._rawText || '') + data.content;
              aiDiv.innerHTML = renderMarkdown(aiDiv._rawText);
            } else if (data.type === 'done') {
              xchatConvId = data.conversation_id;
            } else if (data.type === 'ask_resolved') {
              // 显示「是否解决」按钮
              showResolveButtons(msgs);
            }
          } catch(e) {}
          msgs.scrollTop = msgs.scrollHeight;
        }
        read();
      }).catch(function() { finish(); });
    }
    read();
  }).catch(function(e) {
    typing.remove();
    msgs.appendChild(createMsg('system', '⚠ 连接失败：' + e.message));
    finish();
  });

  function finish() {
    var t = document.getElementById('xchat-msgs').querySelector('.xchat-typing');
    if (t) t.remove();
    xchatSending = false;
    sendBtn.disabled = false;
    document.getElementById('xchat-input').focus();
  }
}

function createMsg(role, text) {
  var div = document.createElement('div');
  div.className = 'xchat-msg ' + role;
  div._rawText = text;
  div.innerHTML = role === 'ai' ? renderMarkdown(text) : escapeHtml(text);
  return div;
}

function renderMarkdown(text) {
  var html = text;
  // 先处理图片 ![alt](url) → <img>
  html = html.replace(/!\[([^\]]*?)\]\(([^)]*?)\)/g, function(m, alt, url) {
    var fid = (url.match(/\/files\/([a-f0-9-]+)\/file-preview/) || [])[1];
    if (fid) url = '/proxy/dify-file/' + fid;
    return '<br><img src="' + url + '" alt="' + alt + '" style="max-width:100%;border-radius:8px;margin:8px 0">';
  });
  // 再处理链接 [text](url) → <a> 标签（排除图片 ![...]）
  html = html.replace(/(^|[^!])\[([^\]]+)\]\(([^)]+)\)/g, function(m, prefix, label, url) {
    return prefix + '<a href="' + url + '" target="_blank" style="color:#6db3ff;text-decoration:underline">' + label + '</a>';
  });
  html = html.replace(/\n/g, '<br>');
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function createTyping() {
  var div = document.createElement('div');
  div.className = 'xchat-typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  return div;
}

// 文件上传预览
var uploadedFiles = [];
document.getElementById('ticket-file').addEventListener('change', function(e) {
  var preview = document.getElementById('preview-imgs');
  for (var i = 0; i < e.target.files.length; i++) {
    var file = e.target.files[i];
    uploadedFiles.push(file);
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = document.createElement('img');
      img.src = ev.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  }
});

// ===== 对话流程控制 =====

function showResolveButtons(msgs) {
  disableInput(true);
  var div = document.createElement('div');
  div.className = 'xchat-msg system';
  div.innerHTML = '<p style="margin-bottom:8px">本次问题是否已解决？</p>' +
    '<div class="xchat-actions">' +
    '<button class="primary" onclick="onResolved()">已解决</button>' +
    '<button onclick="onUnresolved()">未解决</button>' +
    '</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function onResolved() {
  // 直接关闭（closeChat 在闭包内，此处直接操作 DOM）
  var panel = document.getElementById('xchat-container');
  panel.classList.remove('active');
  document.getElementById('xchat-msgs').innerHTML = '<div class="xchat-msg ai">你好！我是JC小智，有什么可以帮你的？</div>';
  xchatConvId = null;
  ticketSubmitting = false;
  uploadedFiles = [];
  document.getElementById('preview-imgs').innerHTML = '';
  var form = document.getElementById('xchat-form');
  if (form) form.style.display = 'none';
  var wrap = document.getElementById('xchat-input-wrap');
  if (wrap) { wrap.style.display = 'flex'; wrap.classList.remove('disabled-input'); }
  var btn = document.getElementById('ticket-submit-btn');
  if (btn) { btn.disabled = false; btn.textContent = '提交工单'; }
  document.getElementById('xchat-input').value = '';
}

function onUnresolved() {
  var msgs = document.getElementById('xchat-msgs');
  var div = document.createElement('div');
  div.className = 'xchat-msg system';
  div.innerHTML = '<p style="margin-bottom:8px">需要工程师支持吗？</p>' +
    '<div class="xchat-actions">' +
    '<button class="primary" onclick="showTicketForm()">需要</button>' +
    '<button onclick="continueChat()">继续对话</button>' +
    '</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function continueChat() {
  disableInput(false);
  document.getElementById('xchat-input').focus();
}

function showTicketForm() {
  document.getElementById('xchat-input-wrap').style.display = 'none';
  document.getElementById('xchat-form').style.display = 'flex';
}

function disableInput(disabled) {
  var wrap = document.getElementById('xchat-input-wrap');
  if (disabled) wrap.classList.add('disabled-input');
  else wrap.classList.remove('disabled-input');
}

var ticketSubmitting = false;

async function submitTicket() {
  if (ticketSubmitting) return;
  var name = document.getElementById('ticket-name').value.trim();
  var phone = document.getElementById('ticket-phone').value.trim();
  var location = document.getElementById('ticket-location').value.trim();
  var desc = document.getElementById('ticket-desc').value.trim();
  if (!name || !phone || !location || !desc) {
    alert('请填写所有必填项');
    return;
  }

  ticketSubmitting = true;
  var btn = document.getElementById('ticket-submit-btn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  // 上传图片
  var imagePaths = [];
  for (var i = 0; i < uploadedFiles.length; i++) {
    var fd = new FormData();
    fd.append('file', uploadedFiles[i]);
    var resp = await fetch('/api/tickets/public-upload', {method:'POST',body:fd});
    if (resp.ok) {
      var j = await resp.json();
      imagePaths.push(j.filename);
    }
  }

  // 提交工单
  var resp = await fetch('/api/chat/ticket', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      conversation_id: xchatConvId || '',
      name: name, phone: phone,
      location: location, description: desc,
      images: imagePaths
    })
  });
  var result = await resp.json();

  var msgs = document.getElementById('xchat-msgs');
  var catLabel = {desktop:'桌面运维',network:'网络',weak_current:'弱电',unknown:'未分类'};
  msgs.appendChild(createMsg('system',
    '✅ 工单已提交！\n分类：' + (catLabel[result.category]||result.category) +
    '\n状态：' + (result.email_status==='sent'?'已发送':'待处理') +
    '\n\n感谢反馈，我们将尽快处理。'));
  msgs.scrollTop = msgs.scrollHeight;

  // 隐藏表单，3秒后关闭
  document.getElementById('xchat-form').style.display = 'none';
  setTimeout(function() { onResolved(); }, 3000);
}
