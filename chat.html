<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1.0, width=device-width" />
  <title>对话 · JC小智</title>
  <meta name="description" content="JC小智 AI 智能对话助手" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
  <link rel="preload" href="/_next/static/css/dd9b026bd6471ae9.css" as="style" />
  <link rel="stylesheet" href="/_next/static/css/dd9b026bd6471ae9.css" />
  <link rel="preload" as="font" href="/fonts/migra/Migra-Regular.woff2" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" as="font" href="/fonts/migra/Migra-Medium.woff2" type="font/woff2" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== Reset & Base ===== */
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background-color: #27282d;
      color: #e4e4e6;
      font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.xchat-ready { opacity: 1; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

    /* ===== Header (matches homepage) ===== */
    .chat-header {
      position: fixed; top: 0; left: 0; right: 0; height: 64px;
      background: rgba(39, 40, 45, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
      display: flex; align-items: center;
      padding: 0 32px;
    }
    .chat-header__inner {
      max-width: 1100px; width: 100%; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; color: #e4e4e6; font-weight: 500;
      cursor: pointer;
    }
    .chat-logo svg { width: 28px; height: 28px; }
    .chat-header__nav { display: flex; gap: 32px; }
    .chat-header__nav span {
      font-size: 14px; color: #b4b4b4; cursor: pointer;
      transition: color 0.2s;
    }
    .chat-header__nav span:hover { color: #fff; }
    .chat-header__back {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #b4b4b4; font-size: 13px; cursor: pointer;
      transition: all 0.2s;
    }
    .chat-header__back:hover { background: rgba(255,255,255,0.08); color: #fff; }

    /* ===== Main layout ===== */
    .chat-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 88px 24px 200px;
      min-height: 100vh;
    }

    /* ===== Welcome banner ===== */
    .chat-welcome {
      text-align: center; padding: 24px 0 32px;
      animation: fadeIn 0.6s ease 0.1s both;
    }
    .chat-welcome__icon {
      width: 56px; height: 56px; margin: 0 auto 12px;
      background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(22,119,255,0.4);
    }
    .chat-welcome__icon svg { width: 32px; height: 32px; color: #fff; }
    .chat-welcome__title {
      font-size: 22px; font-weight: 500; color: #fff; margin: 8px 0 4px;
    }
    .chat-welcome__subtitle {
      font-size: 14px; color: #8a8c93; margin: 0;
    }

    /* ===== Message list ===== */
    .chat-messages { display: flex; flex-direction: column; gap: 16px; }

    .msg { display: flex; gap: 12px; align-items: flex-start; animation: msgIn 0.4s ease both; }
    .msg--user { flex-direction: row-reverse; }
    .msg__avatar {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,0.06);
      color: #b4b4b4;
    }
    .msg--assistant .msg__avatar {
      background: linear-gradient(135deg, #1677ff, #0958d9);
      color: #fff;
    }
    .msg--user .msg__avatar {
      background: linear-gradient(135deg, #8c8c93, #3f3f43);
      color: #fff;
    }
    .msg__bubble {
      max-width: 75%; padding: 12px 16px; border-radius: 12px;
      font-size: 14px; line-height: 1.65; word-wrap: break-word; white-space: pre-wrap;
    }
    .msg--user .msg__bubble {
      background: #1a1b1e; color: #e4e4e6;
      border-top-right-radius: 4px;
    }
    .msg--assistant .msg__bubble {
      background: transparent; color: #fff;
      border-top-left-radius: 4px;
      padding-left: 4px;
      border-left: 2px solid transparent;
      background-image: linear-gradient(180deg, rgba(33,34,38,.5), rgba(20,21,25,.5));
      border-left: 2px solid #1677ff;
    }
    .msg__role {
      font-size: 11px; color: #8a8c93; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .msg--user .msg__role { justify-content: flex-end; }
    .msg__sources {
      margin-top: 10px; padding: 8px 10px;
      background: rgba(22,119,255,0.08);
      border-radius: 6px; font-size: 12px; color: #8ab4ff;
    }
    .msg__sources summary { cursor: pointer; user-select: none; }

    /* ===== System message (centered) ===== */
    .msg--system {
      justify-content: center; animation: msgIn 0.4s ease both;
    }
    .msg--system .msg__bubble {
      background: rgba(255,255,255,0.04);
      color: #b4b4b4;
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 13px; max-width: 90%;
      text-align: center;
      padding: 10px 18px; border-radius: 100px;
    }

    /* ===== Resolve prompt buttons ===== */
    .resolve-buttons {
      display: flex; gap: 12px; justify-content: center; padding: 8px 0;
      animation: msgIn 0.4s ease both;
    }
    .resolve-btn {
      padding: 10px 24px; border-radius: 8px; font-size: 14px;
      cursor: pointer; border: 1px solid; transition: all 0.2s;
      font-family: inherit; font-weight: 500;
    }
    .resolve-btn--yes {
      background: linear-gradient(135deg, #1677ff, #0958d9);
      border-color: transparent; color: #fff;
      box-shadow: 0 2px 8px rgba(22,119,255,0.3);
    }
    .resolve-btn--yes:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(22,119,255,0.5); }
    .resolve-btn--no {
      background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.12); color: #e4e4e6;
    }
    .resolve-btn--no:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

    /* ===== Typing indicator ===== */
    .typing { display: flex; gap: 4px; padding: 8px 4px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #8a8c93; animation: typing 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Ticket form ===== */
    .ticket-form {
      background: rgba(33,34,38,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 24px;
      animation: msgIn 0.4s ease both;
    }
    .ticket-form__title {
      font-size: 16px; font-weight: 500; color: #fff; margin: 0 0 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .ticket-form__title svg { width: 20px; height: 20px; color: #1677ff; }
    .ticket-form__sub {
      font-size: 13px; color: #8a8c93; margin: 0 0 18px;
    }
    .ticket-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .ticket-form__row--full { grid-template-columns: 1fr; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field__label {
      font-size: 12px; color: #8a8c93; font-weight: 500;
    }
    .field__label .req { color: #ff4d4f; margin-left: 2px; }
    .field input, .field textarea {
      background: rgba(26,27,30,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; padding: 10px 12px;
      color: #fff; font-size: 14px;
      font-family: inherit;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22,119,255,0.2);
    }
    .field textarea { min-height: 80px; }

    .upload-area {
      border: 1.5px dashed rgba(255,255,255,0.18);
      border-radius: 8px; padding: 20px;
      text-align: center; color: #8a8c93;
      cursor: pointer; transition: all 0.2s;
      background: rgba(26,27,30,0.4);
    }
    .upload-area:hover { border-color: #1677ff; color: #b4b4b4; background: rgba(22,119,255,0.05); }
    .upload-area svg { width: 32px; height: 32px; margin-bottom: 6px; }
    .upload-area__text { font-size: 13px; }
    .upload-area__hint { font-size: 11px; margin-top: 4px; color: #6a6c73; }
    .upload-area input[type=file] { display: none; }
    .upload-preview {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px; margin-top: 12px;
    }
    .upload-preview__item {
      position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
      background: #1a1b1e; border: 1px solid rgba(255,255,255,0.08);
    }
    .upload-preview__item img { width: 100%; height: 100%; object-fit: cover; }
    .upload-preview__remove {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,0.7); color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 12px; line-height: 1;
      border: none; padding: 0;
    }
    .upload-preview__remove:hover { background: #ff4d4f; }

    .form-actions {
      display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px;
    }
    .btn {
      padding: 10px 24px; border-radius: 6px; font-size: 14px;
      cursor: pointer; border: 1px solid;
      font-family: inherit; font-weight: 500;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn--primary {
      background: linear-gradient(135deg, #1677ff, #0958d9);
      border-color: transparent; color: #fff;
      box-shadow: 0 2px 8px rgba(22,119,255,0.3);
    }
    .btn--primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(22,119,255,0.5); }
    .btn--primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn--ghost {
      background: transparent; border-color: rgba(255,255,255,0.12); color: #b4b4b4;
    }
    .btn--ghost:hover { background: rgba(255,255,255,0.05); color: #fff; }

    /* ===== Composer (input area at bottom) ===== */
    .composer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(39,40,45,0) 0%, rgba(39,40,45,0.95) 30%, #27282d 100%);
      padding: 16px 24px 24px;
      z-index: 50;
    }
    .composer__inner {
      max-width: 900px; margin: 0 auto;
      display: flex; gap: 8px; align-items: flex-end;
      background: linear-gradient(177.75deg,rgba(26,27,30,.9),rgba(12,13,17,.5));
      border-radius: 12px;
      box-shadow: 0 -2px 6px hsla(0,0%,100%,.08),0 5px 18px rgba(0,0,0,.4),0 1px 4px -1px rgba(0,0,0,.302),inset 0 0 0 .3px hsla(0,0%,100%,.1);
      padding: 12px 16px;
    }
    .composer__inner textarea {
      flex: 1; min-height: 24px; max-height: 120px;
      background: transparent; border: none; outline: none; resize: none;
      color: #fff; font-size: 14px; line-height: 1.5;
      font-family: inherit;
    }
    .composer__inner textarea::placeholder { color: #4e4f52; }
    .composer__send {
      flex-shrink: 0; width: 36px; height: 36px;
      border-radius: 8px; border: none;
      background: linear-gradient(135deg, #1677ff, #0958d9);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; box-shadow: 0 2px 8px rgba(22,119,255,0.3);
    }
    .composer__send:hover:not(:disabled) { transform: translateY(-1px); }
    .composer__send:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .composer__send svg { width: 16px; height: 16px; }

    /* ===== Mobile responsive ===== */
    @media (max-width: 640px) {
      .chat-header { padding: 0 16px; }
      .chat-header__nav { display: none; }
      .chat-main { padding: 80px 16px 200px; }
      .msg__bubble { max-width: 85%; }
      .ticket-form { padding: 16px; }
      .ticket-form__row { grid-template-columns: 1fr; }
    }

    /* ===== Success overlay ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(39,40,45,0.95);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; animation: fadeIn 0.3s ease;
    }
    .overlay__card {
      background: rgba(33,34,38,0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 40px;
      text-align: center; max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .overlay__icon {
      width: 64px; height: 64px; margin: 0 auto 16px;
      background: linear-gradient(135deg, #52c41a, #389e0d);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(82,196,26,0.4);
    }
    .overlay__icon svg { width: 36px; height: 36px; color: #fff; }
    .overlay__title { font-size: 18px; font-weight: 500; color: #fff; margin: 0 0 8px; }
    .overlay__text { font-size: 13px; color: #8a8c93; margin: 0 0 20px; }
  </style>
</head>
<body>
  <header class="chat-header">
    <div class="chat-header__inner">
      <div class="chat-logo" onclick="goHome()">
        <svg viewBox="0 0 77 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 29.356c7.928 0 14.356-6.428 14.356-14.356S22.928.645 15 .645.645 7.072.645 15c0 7.928 6.427 14.356 14.355 14.356Z" fill="#010101" stroke="url(#g1)" stroke-width="0.7"/>
          <defs>
            <linearGradient id="g1" x1="15" y1="1" x2="15" y2="29" gradientUnits="userSpaceOnUse">
              <stop stop-color="#353434"/><stop offset="1" stop-color="#0A0909"/>
            </linearGradient>
          </defs>
        </svg>
        <span>JC小智</span>
      </div>
      <nav class="chat-header__nav">
        <span onclick="goHome()">对话</span>
        <span>能力</span>
        <span>方案</span>
      </nav>
      <button class="chat-header__back" onclick="goHome()">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/></svg>
        返回首页
      </button>
    </div>
  </header>

  <main class="chat-main">
    <div class="chat-welcome" id="chat-welcome">
      <div class="chat-welcome__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 2a3 3 0 0 0-3 3v1H7a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V8a2 2 0 0 0-2-2h-2V5a3 3 0 0 0-3-3z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="chat-welcome__title">JC小智 · AI 智能对话助手</h1>
      <p class="chat-welcome__subtitle">故障排查、知识查询、工单申报，一站式解决</p>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
  </main>

  <div class="composer" id="composer">
    <div class="composer__inner">
      <textarea id="composer-input" rows="1" placeholder="输入您的问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="composer__send" id="composer-send" aria-label="发送">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5L14.5 8L1.5 14.5L3 8L1.5 1.5Z" stroke="currentColor" stroke-width="0.5"/></svg>
      </button>
    </div>
  </div>

  <script>
    /* ===========================================================
     * chat.html  -  JC小智 对话页脚本
     * ===========================================================
     *  流程：
     *    1. 页面加载 → 如果有 ?q= 参数，自动发送首个问题
     *    2. 用户输入 → 调 /api/chat/ask 拿到 AI 回答
     *    3. 回答后自动追加「是否解决？」+ 两个按钮
     *    4. 「已解决」→ 弹成功提示 → 3 秒后跳回首页
     *    5. 「未解决」→ 显示工单表单 → 提交后调 /api/chat/ticket
     *    6. 底部 composer 始终可用，可继续提问
     * =========================================================== */
    (function(){
      'use strict';

      // -------- Helpers --------
      var $ = function(id){ return document.getElementById(id); };
      var messages = $('chat-messages');

      function uuid() {
        // RFC4122 v4-ish
        return 'conv-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      }

      function getConversationId() {
        var k = 'xchat_conversation_id';
        try {
          var v = sessionStorage.getItem(k);
          if (v) return v;
          v = uuid();
          sessionStorage.setItem(k, v);
          return v;
        } catch(e) {
          return uuid();
        }
      }

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function scrollToBottom(smooth) {
        window.scrollTo({ top: document.body.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      }

      // -------- Message rendering --------
      function addMessage(role, content, opts) {
        opts = opts || {};
        var wrap = document.createElement('div');
        wrap.className = 'msg msg--' + role;

        var avatar = document.createElement('div');
        avatar.className = 'msg__avatar';
        avatar.textContent = role === 'user' ? '我' : 'AI';

        var bubbleWrap = document.createElement('div');
        var roleLabel = document.createElement('div');
        roleLabel.className = 'msg__role';
        roleLabel.textContent = role === 'user' ? '我' : 'JC小智';

        var bubble = document.createElement('div');
        bubble.className = 'msg__bubble';
        bubble.textContent = content;

        if (role === 'user') {
          bubbleWrap.appendChild(roleLabel);
          bubbleWrap.appendChild(bubble);
        } else {
          bubbleWrap.appendChild(roleLabel);
          bubbleWrap.appendChild(bubble);
        }

        // Sources (for assistant)
        if (opts.sources && opts.sources.length) {
          var det = document.createElement('details');
          det.className = 'msg__sources';
          det.innerHTML = '<summary>📚 参考了 ' + opts.sources.length + ' 条知识库内容</summary><div style="margin-top:6px;line-height:1.5">' +
            opts.sources.map(function(s){
              return '• ' + escapeHtml(s.document_name || s.dataset_name || '文档');
            }).join('<br>') + '</div>';
          bubbleWrap.appendChild(det);
        }

        wrap.appendChild(avatar);
        wrap.appendChild(bubbleWrap);
        messages.appendChild(wrap);
        scrollToBottom();
        return bubble;
      }

      function addSystem(text) {
        var wrap = document.createElement('div');
        wrap.className = 'msg msg--system';
        var b = document.createElement('div');
        b.className = 'msg__bubble';
        b.textContent = text;
        wrap.appendChild(b);
        messages.appendChild(wrap);
        scrollToBottom();
        return wrap;
      }

      function addTyping() {
        var wrap = document.createElement('div');
        wrap.className = 'msg msg--assistant';
        wrap.id = 'typing-indicator';
        wrap.innerHTML =
          '<div class="msg__avatar">AI</div>' +
          '<div><div class="msg__role">JC小智</div>' +
          '<div class="msg__bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>';
        messages.appendChild(wrap);
        scrollToBottom();
      }

      function removeTyping() {
        var t = $('typing-indicator');
        if (t) t.remove();
      }

      // -------- Resolve prompt --------
      function addResolvePrompt(onYes, onNo) {
        var wrap = document.createElement('div');
        wrap.className = 'resolve-buttons';
        wrap.innerHTML =
          '<button class="resolve-btn resolve-btn--yes">✓ 已解决</button>' +
          '<button class="resolve-btn resolve-btn--no">未解决</button>';
        var btns = wrap.querySelectorAll('button');
        btns[0].addEventListener('click', function(){
          wrap.remove();
          addSystem('✓ 很高兴帮您解决了问题！');
          onYes && onYes();
        });
        btns[1].addEventListener('click', function(){
          wrap.remove();
          addSystem('好的，正在为您召唤工程师...');
          onNo && onNo();
        });
        messages.appendChild(wrap);
        scrollToBottom();
      }

      // -------- Ticket form --------
      function showTicketForm() {
        var form = document.createElement('div');
        form.className = 'ticket-form';
        form.id = 'ticket-form';
        form.innerHTML =
          '<div class="ticket-form__title">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m-6 9 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '工单信息收集' +
          '</div>' +
          '<p class="ticket-form__sub">即将召唤工程师为您解决，请您提供以下信息：</p>' +
          '<div class="ticket-form__row">' +
            '<div class="field"><label class="field__label">姓名<span class="req">*</span></label><input type="text" name="name" required></div>' +
            '<div class="field"><label class="field__label">手机号<span class="req">*</span></label><input type="tel" name="phone" required pattern="[0-9+\\-\\s]{6,20}"></div>' +
          '</div>' +
          '<div class="field" style="margin-bottom:12px">' +
            '<label class="field__label">故障发生位置<span class="req">*</span></label>' +
            '<input type="text" name="location" required placeholder="例如：3 楼 301 室 / 总部 2 楼机房">' +
          '</div>' +
          '<div class="field ticket-form__row--full" style="margin-bottom:12px">' +
            '<label class="field__label">故障详情描述<span class="req">*</span></label>' +
            '<textarea name="description" required placeholder="请详细描述故障现象、出现时间、影响范围等"></textarea>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="button" class="btn btn--ghost" data-act="cancel">取消</button>' +
            '<button type="button" class="btn btn--primary" data-act="next">下一步：上传现场图片 →</button>' +
          '</div>';
        messages.appendChild(form);
        scrollToBottom();

        form.querySelector('[data-act=cancel]').addEventListener('click', function(){
          form.remove();
          addSystem('工单已取消');
          attachResolvePromptAgain();
        });
        form.querySelector('[data-act=next]').addEventListener('click', function(){
          var name = form.querySelector('[name=name]').value.trim();
          var phone = form.querySelector('[name=phone]').value.trim();
          var location = form.querySelector('[name=location]').value.trim();
          var description = form.querySelector('[name=description]').value.trim();
          if (!name || !phone || !location || !description) {
            alert('请完整填写所有带 * 的必填项');
            return;
          }
          if (!/^[\d+\-\s]{6,20}$/.test(phone)) {
            alert('手机号格式不正确');
            return;
          }
          // Save into form dataset for next step
          form.dataset.name = name;
          form.dataset.phone = phone;
          form.dataset.location = location;
          form.dataset.description = description;
          showUploadStep(form);
        });
      }

      function showUploadStep(form) {
        form.querySelector('.ticket-form__title').lastChild.textContent = '工单信息确认 + 现场图片';
        form.querySelector('.ticket-form__sub').textContent = '请确认信息并上传现场图片（如有）：';
        // Replace form actions
        var actions = form.querySelector('.form-actions');
        actions.innerHTML =
          '<label class="upload-area" id="upload-area">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<div class="upload-area__text">点击或拖拽上传故障现场图片</div>' +
            '<div class="upload-area__hint">支持 jpg / png / webp，单张最大 10MB</div>' +
            '<input type="file" id="ticket-image" accept="image/*" multiple>' +
          '</label>' +
          '<div class="upload-preview" id="upload-preview"></div>' +
          '<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:18px">' +
            '<button type="button" class="btn btn--ghost" data-act="back">← 上一步</button>' +
            '<button type="button" class="btn btn--primary" data-act="submit">提交工单</button>' +
          '</div>';

        // Move the upload area + preview into the form before the actions
        var uploadArea = actions.querySelector('#upload-area');
        var preview = actions.querySelector('#upload-preview');
        // Re-arrange: insert uploadArea and preview into the form body, then put the buttons in actions
        form.insertBefore(uploadArea, actions);
        form.insertBefore(preview, actions);

        var fileInput = $('ticket-image');
        var uploaded = []; // array of {url, filename}

        function renderPreview() {
          preview.innerHTML = uploaded.map(function(f, i){
            return '<div class="upload-preview__item">' +
              '<img src="' + escapeHtml(f.url) + '" alt="图片">' +
              '<button type="button" class="upload-preview__remove" data-idx="' + i + '">×</button>' +
            '</div>';
          }).join('');
          preview.querySelectorAll('.upload-preview__remove').forEach(function(btn){
            btn.addEventListener('click', function(){
              var idx = parseInt(btn.getAttribute('data-idx'), 10);
              uploaded.splice(idx, 1);
              renderPreview();
            });
          });
        }

        function uploadFiles(files) {
          var filesArr = Array.from(files);
          var pending = filesArr.length;
          if (pending === 0) return;
          filesArr.forEach(function(file){
            if (file.size > 10 * 1024 * 1024) {
              alert('图片 ' + file.name + ' 超过 10MB 限制');
              pending--; if (pending === 0) enableSubmit(); return;
            }
            var fd = new FormData();
            fd.append('file', file);
            fd.append('conversation_id', getConversationId());
            fetch('/api/tickets/public-upload', { method: 'POST', body: fd })
              .then(function(r){ return r.json(); })
              .then(function(data){
                if (data && data.url) {
                  uploaded.push({ url: data.url, filename: data.filename });
                  renderPreview();
                } else {
                  alert('上传失败：' + (data.detail || '未知错误'));
                }
              })
              .catch(function(e){ alert('上传失败：' + e); })
              .finally(function(){ pending--; if (pending === 0) enableSubmit(); });
          });
        }

        fileInput.addEventListener('change', function(){
          uploadFiles(fileInput.files);
          fileInput.value = '';
        });
        uploadArea.addEventListener('dragover', function(e){ e.preventDefault(); uploadArea.style.borderColor = '#1677ff'; });
        uploadArea.addEventListener('dragleave', function(){ uploadArea.style.borderColor = ''; });
        uploadArea.addEventListener('drop', function(e){
          e.preventDefault();
          uploadArea.style.borderColor = '';
          if (e.dataTransfer.files) uploadFiles(e.dataTransfer.files);
        });

        function enableSubmit() {}

        // Back button
        actions.querySelector('[data-act=back]').addEventListener('click', function(){
          form.remove();
          showTicketForm();
          // restore
          // (Re-render full form - simpler to just reload the form)
        });

        // Submit button
        actions.querySelector('[data-act=submit]').addEventListener('click', function(){
          var btn = actions.querySelector('[data-act=submit]');
          btn.disabled = true;
          btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="40"/></svg> 正在提交...';
          var payload = {
            conversation_id: getConversationId(),
            name: form.dataset.name,
            phone: form.dataset.phone,
            location: form.dataset.location,
            description: form.dataset.description,
            images: uploaded.map(function(f){ return f.filename; })
          };
          fetch('/api/chat/ticket', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
            .then(function(r){ return r.json().then(function(b){ return { ok: r.ok, body: b }; }); })
            .then(function(res){
              form.remove();
              var categoryLabel = ({desktop:'桌面运维', network:'网络', weak_current:'弱电', unknown:'未分类'})[res.body.category] || '已分类';
              var statusLabel = res.body.email_status === 'sent' ? '✓ 邮件已发送' : (res.body.email_status === 'failed' ? '⚠ 邮件发送失败' : '邮件待发送');
              addSystem('工单 #' + res.body.id + ' 已提交成功！\n' +
                '故障分类：' + categoryLabel + '\n' +
                '收件邮箱：' + res.body.email_to + '\n' +
                '邮件状态：' + statusLabel + '\n\n' +
                '工程师会尽快与您联系。');
              attachResolvePromptAgain();
            })
            .catch(function(e){
              btn.disabled = false;
              btn.textContent = '提交工单';
              alert('提交失败：' + e);
            });
        });
      }

      function attachResolvePromptAgain() {
        // After ticket submitted/cancelled, ask once more if everything is OK
        setTimeout(function(){
          addResolvePrompt(
            function(){ showSuccessAndHome('感谢您的反馈！工程师会持续跟进。'); },
            function(){ /* noop, just dismiss */ }
          );
        }, 800);
      }

      function showSuccessAndHome(text) {
        var overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML =
          '<div class="overlay__card">' +
            '<div class="overlay__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
            '<h2 class="overlay__title">问题已解决</h2>' +
            '<p class="overlay__text">' + escapeHtml(text || '') + '<br>即将返回首页...</p>' +
          '</div>';
        document.body.appendChild(overlay);
        setTimeout(goHome, 2400);
      }

      function goHome() {
        try { sessionStorage.removeItem('xchat_conversation_id'); } catch(e){}
        document.body.style.transition = 'opacity 0.5s ease';
        document.body.style.opacity = '0';
        setTimeout(function(){ window.location.href = '/'; }, 480);
      }
      window.goHome = goHome;

      // -------- Ask the backend --------
      var asking = false;
      function ask(text) {
        text = (text || '').trim();
        if (!text || asking) return;
        asking = true;
        // Hide welcome on first user message
        var welcome = $('chat-welcome');
        if (welcome) welcome.style.display = 'none';

        addMessage('user', text);
        addTyping();
        var input = $('composer-input');
        var sendBtn = $('composer-send');
        input.disabled = true; sendBtn.disabled = true;

        var assistantBubble = null;

        fetch('/api/chat/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, conversation_id: getConversationId() })
        })
          .then(function(response) {
            if (!response.ok) {
              throw new Error('HTTP status ' + response.status);
            }
            removeTyping();
            var reader = response.body.getReader();
            var decoder = new TextDecoder('utf-8');
            var buffer = '';

            function readChunk() {
              return reader.read().then(function(result) {
                if (result.done) {
                  return;
                }
                buffer += decoder.decode(result.value, { stream: true });
                var lines = buffer.split('\n');
                // Keep the last partial line in the buffer
                buffer = lines.pop();

                lines.forEach(function(line) {
                  line = line.trim();
                  if (!line || !line.startsWith('data:')) return;
                  var dataStr = line.slice(5).trim();
                  if (!dataStr) return;
                  try {
                    var data = JSON.parse(dataStr);
                    if (data.type === 'chunk') {
                      if (!assistantBubble) {
                        assistantBubble = addMessage('assistant', '');
                      }
                      assistantBubble.textContent += data.content;
                      scrollToBottom(true);
                    } else if (data.type === 'done') {
                      if (data.conversation_id) {
                        try { sessionStorage.setItem('xchat_conversation_id', data.conversation_id); } catch(e){}
                      }
                      if (data.sources && data.sources.length) {
                        // find the assistant message wrapper and append details
                        if (assistantBubble && assistantBubble.parentNode) {
                          var bubbleWrap = assistantBubble.parentNode;
                          var det = document.createElement('details');
                          det.className = 'msg__sources';
                          det.innerHTML = '<summary>📚 参考了 ' + data.sources.length + ' 条知识库内容</summary><div style="margin-top:6px;line-height:1.5">' +
                            data.sources.map(function(s){
                              return '• ' + escapeHtml(s.document_name || s.dataset_name || '文档');
                            }).join('<br>') + '</div>';
                          bubbleWrap.appendChild(det);
                          scrollToBottom(true);
                        }
                      }
                    } else if (data.type === 'ask_resolved') {
                      addResolvePrompt(
                        function(){ showSuccessAndHome('感谢您的反馈！'); },
                        function(){ showTicketForm(); }
                      );
                    }
                  } catch (e) {
                    console.error('Failed to parse SSE event:', e);
                  }
                });
                return readChunk();
              });
            }
            return readChunk();
          })
          .catch(function(e){
            removeTyping();
            addMessage('assistant', '⚠ 请求失败：' + e.message);
            addResolvePrompt(
              function(){ showSuccessAndHome(''); },
              function(){ showTicketForm(); }
            );
          })
          .finally(function(){
            asking = false;
            input.disabled = false; sendBtn.disabled = false;
            input.value = ''; autoSize(); input.focus();
            scrollToBottom(true);
          });
      }

      // -------- Composer --------
      var composerInput = $('composer-input');
      var composerSend = $('composer-send');

      function autoSize() {
        composerInput.style.height = 'auto';
        composerInput.style.height = Math.min(120, composerInput.scrollHeight) + 'px';
      }
      composerInput.addEventListener('input', autoSize);
      composerInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          ask(composerInput.value);
        }
      });
      composerSend.addEventListener('click', function(){ ask(composerInput.value); });

      // -------- Auto-send if ?q= present --------
      function initFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var q = params.get('q');
        if (q) {
          // Slight delay so fade-in completes
          setTimeout(function(){ ask(q); }, 400);
        }
      }

      // -------- Boot --------
      document.addEventListener('DOMContentLoaded', function(){
        document.body.classList.add('xchat-ready');
        composerInput.focus();
        initFromQuery();
      });
      // Fallback if DOMContentLoaded already fired
      if (document.readyState !== 'loading') {
        document.body.classList.add('xchat-ready');
        composerInput.focus();
        initFromQuery();
      }
    })();
  </script>
  <script>
    fetch('/api/visit/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'pc',path:'/chat.html'})}).catch(function(){});
  </script>
</body>
