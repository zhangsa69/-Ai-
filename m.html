<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>JC小智</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(14px,4.2vw,18px)}
body{background:var(--bg);color:var(--fg);overflow:hidden;height:calc(var(--vh,1vh)*100);width:100vw;position:fixed;top:0;left:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
input,textarea,button{-webkit-appearance:none;appearance:none;border-radius:0;-webkit-tap-highlight-color:transparent;outline:none}
:root{--blue:#0066ff;--dark:#002244}

/* Theme */
:root,[data-theme=dark]{--bg:#000;--fg:#fff;--fg2:#ccc;--fg3:#555;--card:rgba(18,18,24,.7);--input-bg:rgba(255,255,255,.04);--input-border:rgba(255,255,255,.06);--bubble-ai:rgba(20,20,26,.7);--topbar-bg:rgba(0,0,0,.85);--chatbar-bg:#000}
[data-theme=light]{--bg:#fff;--fg:#111;--fg2:#444;--fg3:#888;--card:rgba(255,255,255,.95);--input-bg:#f0f0f5;--input-border:rgba(0,0,0,.1);--bubble-ai:#f0f0f5;--topbar-bg:rgba(255,255,255,.92);--chatbar-bg:#f5f5f7}
/* 动画: 深色模式隐藏浅色动画, 浅色模式隐藏深色动画 */
[data-theme=dark] .anim-light-only{display:none}
[data-theme=light] .anim-dark-only{display:none}
body{background:var(--bg);color:var(--fg)}
.bottom-glow{opacity:.4}[data-theme=light] .bottom-glow{opacity:.15}
.topbar,.chatbar{background:var(--chatbar-bg)}.topbar{background:var(--topbar-bg)}
.bubble.ai{background:var(--bubble-ai)}.bubble.system{color:var(--fg3)}
.theme-toggle{position:fixed;top:1rem;right:1rem;z-index:100;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--input-bg);border:0.5px solid rgba(128,128,128,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;color:var(--fg2)}

.scene{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  gap:1.2rem;padding:0 1.25rem;overflow:hidden;
  transition:opacity .6s ease,-webkit-transform .6s ease;transition:opacity .6s ease,transform .6s ease}
.scene>*{flex-shrink:1;min-height:0}
.scene.hidden{opacity:0;pointer-events:none;-webkit-transform:translateY(0.5rem);transform:translateY(0.5rem)}
.bottom-glow{position:fixed;bottom:0;left:0;right:0;height:12.5rem;background:linear-gradient(to top,var(--dark),transparent);pointer-events:none;z-index:0}[data-theme=light] .bottom-glow{background:linear-gradient(to top,#e0e0e8,transparent);opacity:0.3}
.glass{background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(2.5rem);backdrop-filter:blur(2.5rem);border:0.5px solid rgba(255,255,255,.06);border-radius:1.25rem}

/* === WELCOME === */
.welcome{z-index:1;justify-content:flex-start;padding-top:18vh}
[data-theme=light] 
@-webkit-keyframes float{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-0.6rem)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.6rem)}}
@-webkit-keyframes breathe{0%,100%{-webkit-transform:scale(1);opacity:.85}50%{-webkit-transform:scale(1.03);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.03);opacity:1}}
@-webkit-keyframes spin{0%{-webkit-transform:rotate(0deg)}100%{-webkit-transform:rotate(360deg)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@-webkit-keyframes orbit{from{-webkit-transform:rotate(0deg) translateX(4.1rem) rotate(0deg)}to{-webkit-transform:rotate(360deg) translateX(4.1rem) rotate(-360deg)}}
@keyframes orbit{from{transform:rotate(0deg) translateX(4.1rem) rotate(0deg)}to{transform:rotate(360deg) translateX(4.1rem) rotate(-360deg)}}

.welcome .greeting{font-size:0.7rem;color:var(--fg2);flex-shrink:0;max-width:90vw;text-align:center;line-height:1.5;-webkit-animation:fadeIn .4s ease-out;animation:fadeIn .4s ease-out}
.welcome .title{font-size:2.1rem;font-weight:700;color:var(--fg);letter-spacing:-.02em;line-height:1.15;text-align:center;flex-shrink:0;
  -webkit-animation:fadeIn .4s .1s ease-out both;animation:fadeIn .4s .1s ease-out both}
@-webkit-keyframes fadeIn{from{opacity:0;-webkit-transform:translateY(0.4rem)}to{opacity:1;-webkit-transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(0.4rem)}to{opacity:1;transform:translateY(0)}}

/* === UIVERSE INPUT === */
#poda{display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;width:19.6rem;height:4.4rem;
  -webkit-animation:fadeIn .4s .2s ease-out both;animation:fadeIn .4s .2s ease-out both}
.p-white,.p-border,.p-dbb,.p-glow{max-height:4.4rem;max-width:19.6rem;height:100%;width:100%;position:absolute;overflow:hidden;z-index:-1;border-radius:0.75rem;filter:blur(3px)}
.p-input{background-color:#010201;border:none;width:18.8rem;height:3.5rem;border-radius:0.6rem;color:#fff;padding:0 3.4rem 0 1.25rem;font-size:1.1rem;font-family:inherit;outline:none}
.p-input::placeholder{color:#c0b9c0}
.p-inputmask{pointer-events:none;width:6.25rem;height:1.25rem;position:absolute;background:linear-gradient(90deg,transparent,#000);top:1.1rem;left:4.4rem}
#p-main:focus-within>.p-inputmask{display:none}
.p-pink{pointer-events:none;width:1.9rem;height:1.25rem;position:absolute;background:#cf30aa;top:0.6rem;left:0.3rem;filter:blur(1.25rem);opacity:.8;transition:all 2s}
#p-main:hover>.p-pink{opacity:0}
.p-white{max-height:3.9rem;max-width:19.2rem;border-radius:0.6rem;filter:blur(2px)}
.p-white::before{content:"";z-index:-2;text-align:center;top:50%;left:50%;transform:translate(-50%,-50%) rotate(83deg);position:absolute;width:37.5rem;height:37.5rem;background-repeat:no-repeat;background-position:0 0;filter:brightness(1.4);background-image:conic-gradient(rgba(0,0,0,0) 0%,#a099d8,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 50%,#dfa2da,rgba(0,0,0,0) 58%);transition:all 2s}
.p-border{max-height:3.7rem;max-width:18.9rem;border-radius:0.7rem;filter:blur(0.5px)}
.p-border::before{content:"";z-index:-2;text-align:center;top:50%;left:50%;transform:translate(-50%,-50%) rotate(70deg);position:absolute;width:37.5rem;height:37.5rem;filter:brightness(1.3);background-repeat:no-repeat;background-position:0 0;background-image:conic-gradient(#1c191c,#402fb5 5%,#1c191c 14%,#1c191c 50%,#cf30aa 60%,#1c191c 64%);transition:all 2s}
.p-dbb{max-height:4.1rem;max-width:19.5rem}
.p-dbb::before{content:"";z-index:-2;text-align:center;top:50%;left:50%;transform:translate(-50%,-50%) rotate(82deg);position:absolute;width:37.5rem;height:37.5rem;background-repeat:no-repeat;background-position:0 0;background-image:conic-gradient(rgba(0,0,0,0),#18116a,rgba(0,0,0,0) 10%,rgba(0,0,0,0) 50%,#6e1b60,rgba(0,0,0,0) 60%);transition:all 2s}
#poda:hover>.p-dbb::before{transform:translate(-50%,-50%) rotate(262deg)}
#poda:hover>.p-glow::before{transform:translate(-50%,-50%) rotate(240deg)}
#poda:hover>.p-white::before{transform:translate(-50%,-50%) rotate(263deg)}
#poda:hover>.p-border::before{transform:translate(-50%,-50%) rotate(250deg)}
#poda:focus-within>.p-dbb::before{transform:translate(-50%,-50%) rotate(442deg);transition:all 4s}
#poda:focus-within>.p-glow::before{transform:translate(-50%,-50%) rotate(420deg);transition:all 4s}
#poda:focus-within>.p-white::before{transform:translate(-50%,-50%) rotate(443deg);transition:all 4s}
#poda:focus-within>.p-border::before{transform:translate(-50%,-50%) rotate(430deg);transition:all 4s}
.p-glow{overflow:hidden;filter:blur(1.9rem);opacity:.4;max-height:8.1rem;max-width:22.1rem}
.p-glow::before{content:"";z-index:-2;text-align:center;top:50%;left:50%;transform:translate(-50%,-50%) rotate(60deg);position:absolute;width:62.4rem;height:62.4rem;background-repeat:no-repeat;background-position:0 0;background-image:conic-gradient(#000,#402fb5 5%,#000 38%,#000 50%,#cf30aa 60%,#000 87%);transition:all 2s}
@keyframes poda-rotate{100%{transform:translate(-50%,-50%) rotate(450deg)}}
#p-main{position:relative}
.p-search{position:absolute;right:0.75rem;top:0.94rem;cursor:pointer;z-index:3}

[data-theme=light] .p-input{background-color:#fff;color:#111}
[data-theme=light] .p-input::placeholder{color:#888}
[data-theme=light] .p-inputmask{background:linear-gradient(90deg,transparent,#fff)}
[data-theme=light] [data-theme=light] .p-white::before{background-image:conic-gradient(rgba(0,0,0,0) 0%,#d0d0d8,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 50%,#d0d0d8,rgba(0,0,0,0) 58%)}
[data-theme=light] .p-border::before{background-image:conic-gradient(#e8e8ee,#8080b8 5%,#e8e8ee 14%,#e8e8ee 50%,#b0a0c0 60%,#e8e8ee 64%)}
[data-theme=light] .p-dbb::before{background-image:conic-gradient(rgba(0,0,0,0),#4040a0,rgba(0,0,0,0) 10%,rgba(0,0,0,0) 50%,#aa66aa,rgba(0,0,0,0) 60%)}
[data-theme=light] .p-glow::before{background-image:conic-gradient(#fff,#8080c0 5%,#fff 38%,#fff 50%,#b0a0c0 60%,#fff 87%)}
.loader{display:none}
.load{display:inline-block;height:calc(var(--i)*15);width:calc(var(--i)*15);background-color:transparent;
  position:absolute;border-top:5px #6090ff solid;border-radius:50%;top:50%;left:50%;
  -webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
  -webkit-animation:turn 2s infinite linear;animation:turn 2s infinite linear}
.load:nth-child(odd){-webkit-animation:turn 2s infinite linear reverse;animation:turn 2s infinite linear reverse}
@-webkit-keyframes turn{100%{-webkit-transform:translate(-50%,-50%) rotateZ(360deg);transform:translate(-50%,-50%) rotateZ(360deg)}}
@keyframes turn{100%{transform:translate(-50%,-50%) rotateZ(360deg)}}

/* === LOADING === */
.loading{z-index:2}
.loading .l-orb{position:relative;width:7.5rem;height:7.5rem}
.loading .l-orb-ring{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%;border:2px solid transparent;
  border-top-color:rgba(80,160,255,.25);border-right-color:rgba(80,160,255,.08);
  -webkit-animation:spin 8s linear infinite,breathe 3s ease-in-out infinite;animation:spin 8s linear infinite,breathe 3s ease-in-out infinite}
.loading .l-orb-glow{position:absolute;top:-1.1rem;left:-1.1rem;right:-1.1rem;bottom:-1.1rem;border-radius:50%;
  background:radial-gradient(circle,rgba(0,80,200,.06),transparent 70%);
  -webkit-animation:breathe 3s ease-in-out infinite;animation:breathe 3s ease-in-out infinite}
.capsule{padding:0.9rem 2.25rem;display:flex;align-items:center}
.capsule>*+*{margin-left:0.6rem}
.capsule .text{color:var(--fg2);font-size:0.85rem;letter-spacing:.03em}
.spinner{--accent:#6090e0;--max-scale:4;--speed:0.2;display:flex;gap:0.3em;transform:skew(15deg,10deg)}
.spinner span{display:block;background-color:var(--accent);box-shadow:1px 1px 5px 0.2px var(--accent);width:0.7px;height:0.6em}
.spinner .spinner-part-0{animation:load432 calc(1s/var(--speed)) linear infinite}
.spinner .spinner-part-1{animation:load432 calc(0.16s/var(--speed)) linear infinite}
.spinner .spinner-part-2{animation:load432 calc(0.4s/var(--speed)) linear infinite}
.spinner .spinner-part-3{animation:load432 calc(0.5s/var(--speed)) linear infinite}
@-webkit-keyframes load432{50%{-webkit-transform:scaleY(var(--max-scale));transform:scaleY(var(--max-scale))}}
@keyframes load432{50%{transform:scaleY(var(--max-scale))}}

/* === ANSWER === */
.answer{z-index:3;padding:0;justify-content:flex-start;gap:0}
.answer .topbar{width:100%;padding:0.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid rgba(255,255,255,.04);flex-shrink:0;background:var(--topbar-bg);-webkit-backdrop-filter:blur(1.25rem);backdrop-filter:blur(1.25rem)}
.answer .topbar span{font-size:0.85rem;font-weight:600;color:#ccc}
.answer .topbar button{background:transparent;border:none;color:var(--fg3);font-size:0.75rem;cursor:pointer}
.answer .scroll{flex:1;overflow-y:auto;width:100%;padding:1.25rem 1rem;-webkit-overflow-scrolling:touch}
.answer .scroll::-webkit-scrollbar{display:none}
.bubble{max-width:85%;padding:0.75rem 1rem;border-radius:1rem;font-size:0.82rem;line-height:1.6;word-break:break-word;margin-bottom:0.9rem;-webkit-animation:msgIn .4s ease-out;animation:msgIn .4s ease-out}
.bubble.user{margin-left:auto;background:rgba(0,60,140,.4);border:0.5px solid rgba(80,150,255,.08);border-radius:1rem 1rem 0.25rem 1rem;color:#e0e0f0}
.bubble.ai{background:rgba(20,20,26,.7);border:0.5px solid rgba(255,255,255,.04);border-radius:0.25rem 1rem 1rem 1rem;color:#ccc}
.bubble.system{max-width:100%;background:transparent;color:var(--fg3);text-align:center;font-size:0.75rem}
.bubble img{max-width:100%;border-radius:0.6rem;margin-top:0.5rem}
.bubble a{color:#7090c0}
@-webkit-keyframes msgIn{from{opacity:0;-webkit-transform:translateY(0.5rem)}to{opacity:1;-webkit-transform:translateY(0)}}
@keyframes msgIn{from{opacity:0;transform:translateY(0.5rem)}to{opacity:1;transform:translateY(0)}}

.chatbar{width:100%;padding:0.6rem 1rem 1rem;display:flex;flex-shrink:0;border-top:0.5px solid rgba(255,255,255,.04);background:var(--chatbar-bg)}
.chatbar>*+*{margin-left:0.5rem}
.chatbar textarea{flex:1;min-width:0;background:var(--input-bg);border:0.5px solid var(--input-border);border-radius:0.9rem;padding:0.6rem 0.9rem;color:var(--fg2);font-size:0.85rem;resize:none;outline:none;font-family:inherit;min-height:2.4rem;max-height:4.8rem;line-height:1.5;caret-color:var(--blue)}
.chatbar textarea::-webkit-input-placeholder{color:#444}
.chatbar textarea::placeholder{color:#444}
.chatbar .btn-send{background:rgba(0,100,255,.08);border:0.5px solid rgba(80,150,255,.12);color:#c0d0f0;padding:0 1.25rem;border-radius:0.9rem;font-size:0.82rem;font-weight:500;cursor:pointer;flex-shrink:0;font-family:inherit}
.chatbar .btn-send:active{transform:scale(.96);background:rgba(0,100,255,.2)}

.actions{display:flex;flex-wrap:wrap;padding:0.4rem 0}
.actions>*+*{margin-left:0.5rem}
.actions button{color:var(--fg2);padding:0.5rem 1.2rem;border-radius:0.5rem;font-size:0.78rem;cursor:pointer;border:2px solid rgba(80,150,255,.3);background:transparent;color:#6090e0;font-family:inherit;-webkit-animation:jello-horizontal .9s both;animation:jello-horizontal .9s both;outline:none}
.actions button:hover,.actions button:active{background:#1677ff;color:#fff;-webkit-animation:squeeze3124 .9s both;animation:squeeze3124 .9s both}
.actions button.primary{border-color:rgba(80,150,255,.5);color:#80b0ff}
@-webkit-keyframes squeeze3124{0%{-webkit-transform:scale3d(1,1,1)}30%{-webkit-transform:scale3d(1.25,0.75,1)}40%{-webkit-transform:scale3d(0.75,1.25,1)}50%{-webkit-transform:scale3d(1.15,0.85,1)}65%{-webkit-transform:scale3d(0.95,1.05,1)}75%{-webkit-transform:scale3d(1.05,0.95,1)}100%{-webkit-transform:scale3d(1,1,1)}}
@keyframes squeeze3124{0%{transform:scale3d(1,1,1)}30%{transform:scale3d(1.25,0.75,1)}40%{transform:scale3d(0.75,1.25,1)}50%{transform:scale3d(1.15,0.85,1)}65%{transform:scale3d(0.95,1.05,1)}75%{transform:scale3d(1.05,0.95,1)}100%{transform:scale3d(1,1,1)}}

.chat-form{display:none;flex-direction:column;position:relative;justify-content:center;min-height:100%;margin:1.2rem -0.5rem;padding:0}.chat-form::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:5}[data-theme=light] .chat-form::before{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.chat-form-card{position:relative;z-index:6;background:var(--card-bg);box-shadow:0 15px 25px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:0.7rem;padding:1.5rem 1rem;border-radius:0.5rem;border:0.5px solid var(--card-border);margin:0;width:100%}
.chat-form-card .form-title{font-size:1.5rem;font-weight:800;color:var(--fg);margin-bottom:0.3rem}
.form-field{position:relative;width:100%}
.form-field .f-input{margin-top:0.9rem;width:100%;box-sizing:border-box;outline:none;border-radius:0.5rem;height:2.8rem;border:1.5px solid rgba(128,128,140,.35);background:transparent;padding:0 0.8rem;font-size:0.95rem;font-family:inherit;color:var(--fg)}
.form-field .f-input:focus{border-color:#2d79f3}[data-theme=light] .form-field .f-input{border-color:rgba(0,0,0,.15)}
.form-field .f-label{position:absolute;top:1.55rem;left:0.9rem;color:var(--fg3);transition:all .3s ease;pointer-events:none;z-index:2;font-size:0.85rem}
.form-field .f-input:focus~.f-label,.form-field .f-input:not(:placeholder-shown)~.f-label{top:0.3rem;left:0.3rem;font-size:0.75rem;color:#2d79f3;background:var(--card-bg);padding:0 0.3rem}
.form-field textarea.f-input{height:8rem;resize:vertical;padding-top:0.8rem}
.submit-btn{margin-top:1rem;height:3.4rem;border-radius:0.7rem;border:0;outline:none;color:#fff;font-size:1.1rem;font-weight:700;background:linear-gradient(180deg,#363636 0%,#1b1b1b 50%,#000 100%);box-shadow:0 0 0 0 #fff,0 0 0 0 #0000003a;transition:all .3s cubic-bezier(.15,.83,.66,1);cursor:pointer;font-family:inherit}
.submit-btn:hover{box-shadow:0 0 0 2px #fff,0 0 0 4px #0000003a}
.submit-btn:active{transform:scale(.98)}
.upload{margin-top:0.3rem;display:inline-flex;align-items:center;gap:0.5rem;padding:0.6rem 0.8rem;border:1.5px dashed rgba(128,128,140,.35);border-radius:0.5rem;color:var(--fg3);font-size:0.85rem;cursor:pointer}[data-theme=light] .upload{border-color:rgba(0,0,0,.15)}
.preview-box{display:flex;gap:0.25rem;flex-wrap:wrap;margin-top:0.3rem}
.preview-box img{width:3rem;height:3rem;object-fit:cover;border-radius:0.25rem}
.upload{display:inline-flex;align-items:center;gap:0.5rem;padding:0.6rem 0.8rem;border:1.5px dashed rgba(128,128,140,.3);border-radius:0.5rem;color:var(--fg3);font-size:0.85rem;cursor:pointer;margin-top:0.3rem}[data-theme=light] .upload{border-color:rgba(0,0,0,.15)}
.preview-box{display:flex;gap:0.25rem;flex-wrap:wrap}
.preview-box img{width:3rem;height:3rem;object-fit:cover;border-radius:0.25rem}

.typing{display:flex;padding:0.5rem 0.75rem}
.typing .spinner{--accent:#6090e0;--max-scale:4;--speed:0.2;display:flex;gap:0.3em;transform:skew(15deg,10deg)}
.typing .spinner span{display:block;background-color:var(--accent);box-shadow:1px 1px 5px 0.2px var(--accent);width:0.7px;height:0.6em}
.typing .spinner .sp-part-0{animation:load432 calc(1s/var(--speed)) linear infinite}
.typing .spinner .sp-part-1{animation:load432 calc(0.16s/var(--speed)) linear infinite}
.typing .spinner .sp-part-2{animation:load432 calc(0.4s/var(--speed)) linear infinite}
.typing .spinner .sp-part-3{animation:load432 calc(0.5s/var(--speed)) linear infinite}
@-webkit-keyframes load432{50%{-webkit-transform:scaleY(var(--max-scale));transform:scaleY(var(--max-scale))}}
@keyframes load432{50%{transform:scaleY(var(--max-scale))}}
.switch{position:relative;display:inline-block;width:3.75rem;height:2.1rem}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#2196f3;transition:.4s;z-index:0;overflow:hidden}
.sun-moon{position:absolute;height:1.6rem;width:1.6rem;left:0.25rem;bottom:0.25rem;background-color:yellow;transition:.4s;border-radius:50%}
input:checked+.slider{background-color:#111}
input:checked+.slider .sun-moon{transform:translateX(1.6rem);background-color:#fff;animation:rotate-center .6s ease-in-out both}
@keyframes rotate-center{0%{transform:translateX(1.6rem) rotate(0deg)}100%{transform:translateX(1.6rem) rotate(360deg)}}
.moon-dot{opacity:0;transition:.4s;fill:gray}
input:checked+.slider .moon-dot{opacity:1}
.slider.round{border-radius:2.1rem}
#moon-dot-1{left:0.6rem;top:0.2rem;position:absolute;width:0.4rem;height:0.4rem;z-index:4}
#moon-dot-2{left:0.1rem;top:0.6rem;position:absolute;width:0.6rem;height:0.6rem;z-index:4}

.disabled{opacity:.35;pointer-events:none}body:has(input:focus) #pageFooter,body:has(textarea:focus) #pageFooter{opacity:0}

  <div class="title">随时待命 尽管吩咐<br>今天有什么想法？</div>

<!-- SCENE 3 -->
<div class="scene answer hidden" id="answer">
  <div class="topbar"><span>JC小智</span><button onclick="goWelcome()">关闭</button></div>
  <div class="scroll" id="cs"><div class="bubble ai">你好，有什么可以帮你的？</div></div>
  <div class="chatbar" id="cb">
    <textarea id="ci" placeholder="继续提问..." rows="1"></textarea>
    <button class="btn-send" id="cbtn" onclick="sendMsg()">发送</button>
  </div>
  <div class="chat-form" id="cf"><div class="chat-form-card" style="width:calc(100vw - 2rem);max-width:100%">
    <span class="form-title">工单报修</span>
    <div class="form-field"><input required class="f-input" id="fn" type="text" placeholder=" "><label class="f-label" for="fn">姓名</label></div>
    <div class="form-field"><input required class="f-input" id="fp" type="text" placeholder=" "><label class="f-label" for="fp">手机号</label></div>
    <div class="form-field"><input required class="f-input" id="fl" type="text" placeholder=" "><label class="f-label" for="fl">故障位置</label></div>
    <div class="form-field"><textarea required class="f-input" id="fd" placeholder=" "></textarea><label class="f-label" for="fd">故障详情描述</label></div>
    <div><label class="upload">+ 上传照片<input type="file" id="ff" accept="image/*" multiple hidden></label></div>
    <div class="preview-box" id="pv"></div>
    <button class="submit-btn" id="fs" onclick="submitTicket()">提交工单</button>
  </div></div>
</div>

<script>
function toggleTheme(){var t=document.documentElement;var cb=document.getElementById("themeToggle");t.dataset.theme=cb.checked?"dark":"light";localStorage.theme=t.dataset.theme}
(function(){var s=localStorage.theme||"dark";document.documentElement.dataset.theme=s;var cb=document.getElementById("themeToggle");if(cb)cb.checked=s==="dark"})();
function hideFooterOnFocus(){var f=document.getElementById("pageFooter");if(!f)return;var inputs=document.querySelectorAll("input,textarea");for(var i=0;i<inputs.length;i++){inputs[i].addEventListener("focus",function(){f.style.opacity="0"});inputs[i].addEventListener("blur",function(){f.style.opacity="1"})}}hideFooterOnFocus();
function setVH(){document.documentElement.style.setProperty('--vh',window.innerHeight*0.01+'px')}
setVH();window.addEventListener('resize',setVH);window.addEventListener('orientationchange',function(){setTimeout(setVH,100)});

var conv=null,sending=false,ts=false,uf=[],tm=null;

function show(id){['welcome','loading','answer'].forEach(function(s){document.getElementById(s).classList.toggle('hidden',s!==id)});var f=document.getElementById('pageFooter');if(f)f.style.display=id==='welcome'?'':'none'}

function goWelcome(){if(tm)clearTimeout(tm);resetAll();show('welcome');document.getElementById('cb').style.display='flex';document.getElementById('cf').style.display='none'}

function goLoad(q){var m=q.trim();if(!m){alert('请输入问题');return};show('loading');tm=setTimeout(function(){show('answer');resetAll();document.getElementById('ci').value=m;setTimeout(sendMsg,200)},1200)}

function resetAll(){
  document.getElementById('cs').innerHTML='<div class="bubble ai">你好，有什么可以帮你的？</div>';
  conv=null;sending=ts=false;uf=[];document.getElementById('pv').innerHTML='';
  document.getElementById('cb').style.display='flex';document.getElementById('cf').style.display='none';
  document.getElementById('cb').classList.remove('disabled');
  document.getElementById('fs').disabled=false;document.getElementById('fs').textContent='提交工单';
  document.getElementById('ci').value=''
}

function addMsg(role,txt,html){
  var d=document.createElement('div');d.className='bubble '+role;
  if(html)d.innerHTML=html;else d.textContent=txt;return d
}

function md(t){
  t=t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,function(_,a,u){var m=u.match(/\/files\/([a-f0-9-]+)\/file-preview/);if(m)u='/proxy/dify-file/'+m[1];return'<br><img src='+u+' alt='+a+' style=max-width:100%;border-radius:0.6rem;margin-top:0.5rem>'});
  t=t.replace(/(^|[^!])\[([^\]]+)\]\(([^)]+)\)/g,function(_,p,l,u){return p+'<a href='+u+' target=_blank>'+l+'</a>'});
  return t.replace(/\n/g,'<br>')
}

async function sendMsg(){
  if(sending)return;var m=document.getElementById('ci').value.trim();if(!m)return;
  sending=true;document.getElementById('cbtn').disabled=true;
  var cs=document.getElementById('cs');cs.appendChild(addMsg('user',m));document.getElementById('ci').value='';
  var t=document.createElement('div');t.className='typing';t.innerHTML='<div class=spinner><span class=sp-part-0></span><span class=sp-part-1></span><span class=sp-part-2></span><span class=sp-part-3></span><span class=sp-part-0></span><span class=sp-part-1></span><span class=sp-part-2></span><span class=sp-part-3></span></div>';cs.appendChild(t);cs.scrollTop=cs.scrollHeight;
  try{
    var r=await fetch('/api/chat/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,conversation_id:conv})});
    var rd=r.body.getReader(),dc=new TextDecoder(),ad=null;
    while(true){
      var x=await rd.read();if(x.done)break;
      var ls=dc.decode(x.value,{stream:true}).split('\n');
      for(var i=0;i<ls.length;i++){
        var l=ls[i].trim();if(!l.startsWith('data:'))continue;
        try{var d=JSON.parse(l.slice(5))}catch(e){continue}
        if(d.type==='chunk'){if(!ad){t.remove();ad=addMsg('ai','');cs.appendChild(ad)}ad._t=(ad._t||'')+d.content;ad.innerHTML=md(ad._t)}
        else if(d.type==='done')conv=d.conversation_id
        else if(d.type==='ask_resolved'){var dv=document.createElement('div');dv.className='bubble system';dv.innerHTML='<p style=margin-bottom:0.25rem>本次问题是否已解决？</p><div class=actions><button class=primary onclick=onOK()>已解决</button><button onclick=onNO()>未解决</button></div>';cs.appendChild(dv);cs.scrollTop=cs.scrollHeight;disInput(true)}
        cs.scrollTop=cs.scrollHeight
      }
    }
  }catch(e){t.remove();cs.appendChild(addMsg('system','连接失败'))}
  t.remove();sending=false;document.getElementById('cbtn').disabled=false
}

function onOK(){goWelcome()}
function onNO(){var d=document.createElement('div');d.className='bubble system';d.innerHTML='<p style=margin-bottom:0.25rem>需要工程师支持吗？</p><div class=actions><button class=primary onclick=toggleForm()>需要</button><button onclick=contChat()>继续对话</button></div>';document.getElementById('cs').appendChild(d);document.getElementById('cs').scrollTop=document.getElementById('cs').scrollHeight}
function contChat(){disInput(false);document.getElementById('ci').focus()}
function toggleForm(){document.getElementById('cb').style.display='none';document.getElementById('cf').style.display='flex';document.getElementById('cf').scrollIntoView({behavior:'smooth'})}
function disInput(v){var b=document.getElementById('cb');if(v)b.classList.add('disabled');else b.classList.remove('disabled')}

document.getElementById('ff').addEventListener('change',function(e){
  var p=document.getElementById('pv');
  for(var i=0;i<e.target.files.length;i++){var f=e.target.files[i];uf.push(f);
    var r=new FileReader();
    r.onload=function(ev){var img=document.createElement('img');img.src=ev.target.result;p.appendChild(img)};
    r.readAsDataURL(f)
  }
});

async function submitTicket(){
  if(ts)return;var n=document.getElementById('fn').value.trim(),ph=document.getElementById('fp').value.trim(),l=document.getElementById('fl').value.trim(),d=document.getElementById('fd').value.trim();
  if(!n||!ph||!l||!d){alert('请填写完整');return}
  ts=true;var b=document.getElementById('fs');b.disabled=true;b.textContent='提交中...';
  var ps=[];
  for(var i=0;i<uf.length;i++){var fd=new FormData();fd.append('file',uf[i]);var r=await fetch('/api/tickets/public-upload',{method:'POST',body:fd});if(r.ok){var j=await r.json();ps.push(j.filename)}}
  var r=await fetch('/api/chat/ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:conv||'',name:n,phone:ph,location:l,description:d,images:ps})});
  var res=await r.json();var cat={desktop:'桌面运维',network:'网络',weak_current:'弱电'};
  document.getElementById('cs').appendChild(addMsg('system','工单已提交 · '+(cat[res.category]||res.category)+(res.email_status==='sent'?' · 已通知':'')));
  document.getElementById('cf').style.display='none';setTimeout(goWelcome,2500)
}

document.getElementById('ci').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,4.8*parseFloat(getComputedStyle(document.documentElement).fontSize))+'px'});
</script>

fetch('/api/visit/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'mobile',path:'/m.html'})}).catch(function(){});
</script>
